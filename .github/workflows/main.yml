name: RDP (enable for configurable hours, default 10)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours to keep RDP enabled (default 10)'
        required: false
        default: '10'

jobs:
  secure-rdp:
    runs-on: windows-latest
    # allow a bit of buffer above requested hours (10h = 600m). Set to 660 (11h).
    timeout-minutes: 660
    env:
      HOURS: ${{ github.event.inputs.hours }}
      # Provide your Tailscale auth key as repo secret TAILSCALE_AUTHKEY
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      # TARGETS secret not needed for this runner-based approach (we advertise runner's Tailscale IP)
      # Create/Use Windows local user "RDP" with generated password; password is written to GITHUB_ENV
    steps:
      - name: Checkout (not required, but convenient)
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings (enable)
        shell: pwsh
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          # (Optional) allow less strict auth for compatibility
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          # Replace any existing rule with same name
          netsh advfirewall firewall delete rule name="RDP-Tailscale" || $null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with secure random password
        shell: pwsh
        run: |
          # generate a reasonably strong password (12+ chars)
          $chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+[]{};:,.<>?"
          $password = -join ((1..16) | ForEach-Object { $chars | Get-Random -Count 1 })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            # if user exists, set new password
            Set-LocalUser -Name "RDP" -Password $securePass
          } else {
            New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -ErrorAction Stop
          }

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          # Export credentials for later display in workflow log (written to GITHUB_ENV)
          # NOTE: this will put the password in the workflow logs/environment — keep repo private and protect access.
          "RDP_USER=RDP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ("RDP_PASS=" + $password) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Tailscale
        shell: pwsh
        run: |
          choco install tailscale -y
          Start-Sleep -Seconds 2
          if (Get-Service -Name tailscaled -ErrorAction SilentlyContinue) { Start-Service tailscaled -ErrorAction SilentlyContinue } elseif (Get-Service -Name Tailscale -ErrorAction SilentlyContinue) { Start-Service Tailscale -ErrorAction SilentlyContinue }

      - name: Bring up Tailscale (runner joins your tailnet)
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if (-not $env:TAILSCALE_AUTHKEY) { throw "Set repo secret TAILSCALE_AUTHKEY" }
          # Start tailscale and join
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="$env:TAILSCALE_AUTHKEY" --hostname "gha-runner-${{ github.run_id }}" --accept-dns --accept-routes || & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="$env:TAILSCALE_AUTHKEY" --hostname "gha-runner-${{ github.run_id }}" || throw "tailscale up failed"
          Start-Sleep -Seconds 5
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          if (-not $ip) { throw "No Tailscale IPv4 assigned" }
          # write to env for later steps
          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify RDP Accessibility (simple check)
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $test.TcpTestSucceeded) {
            Write-Warning "TCP test to 3389 failed (may still be fine if service not yet ready)"
          } else {
            Write-Host "TCP 3389 reachable on $env:TAILSCALE_IP"
          }

      - name: Maintain connection for requested hours then cleanup (default 10)
        shell: pwsh
        run: |
          $hours = [int]($env:HOURS)
          if ($hours -lt 1) { $hours = 10 }
          $end = (Get-Date).AddHours($hours)
          Write-Host "Keeping RDP enabled until $end (for $hours hour(s))"
          while ((Get-Date) -lt $end) {
            $remaining = $end - (Get-Date)
            Write-Host ("[{0}] RDP active. Time left: {1}" -f (Get-Date), $remaining.ToString())
            Start-Sleep -Seconds 60
          }

          Write-Host "Time elapsed — running cleanup to disable RDP and remove firewall rule."

          try {
            # Disable Remote Desktop
            Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 1 -Force
            # Remove firewall rule we added
            netsh advfirewall firewall delete rule name="RDP-Tailscale" || $null
            # (Optional) remove the local user created earlier
            if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              # Remove from groups first
              Try { Remove-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue } Catch {}
              Try { Remove-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue } Catch {}
              # Then remove user
              Remove-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
            }
          } catch {
            Write-Warning "Cleanup encountered an error: $_"
          }

          Write-Host "Cleanup finished. RDP disabled."
      - name: Show connection info (end)
        shell: pwsh
        run: |
          Write-Host "If you saved credentials, view them in Actions run artifacts or environment (if set)."
          Write-Host "Note: If runner timed out earlier because of account limits, consider using a self-hosted runner."
