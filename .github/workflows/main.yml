name: RDP (10-hour session, auto-cleanup)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours to keep RDP enabled (default 10)'
        required: false
        default: '10'

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 660   # 11 hours to allow cleanup after 10h
    env:
      HOURS: ${{ github.event.inputs.hours }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" || $null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name 'RDP' -Password $securePass -AccountNeverExpires -Description "Temporary RDP user"
          } else {
            $u = Get-LocalUser -Name 'RDP'
            $u | Set-LocalUser -Password $securePass
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_CREDS=User: RDP | Password: $password"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection (fixed auth handling)
        shell: pwsh
        run: |
          $exe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          $auth = $env:TAILSCALE_AUTH_KEY
          if (-not $auth) {
            Write-Error "Set repo secret TAILSCALE_AUTH_KEY"
            exit 1
          }
          & $exe up --authkey="$auth" --hostname="gh-runner-$($env:GITHUB_RUN_ID)" --accept-routes --accept-dns
          Start-Sleep -Seconds 5

          $tsIP = $null; $retries = 0
          while (-not $tsIP -and $retries -lt 20) {
            try { $tsIP = (& $exe ip -4).Trim() } catch { $tsIP = $null }
            if ($tsIP) { break }
            Start-Sleep -Seconds 3
            $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned. Exiting."; exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Keep RDP available for requested hours (then cleanup)
        shell: pwsh
        run: |
          $hours = [int]$env:HOURS
          if ($hours -lt 1) { $hours = 10 }
          Write-Host "Keeping RDP available for $hours hour(s)..."
          $end = (Get-Date).AddHours($hours)
          while ((Get-Date) -lt $end) {
            $remaining = $end - (Get-Date)
            Write-Host ("RDP active. Time remaining: {0:hh\:mm\:ss}" -f $remaining)
            Start-Sleep -Seconds 60
          }

          Write-Host "Requested time elapsed. Performing cleanup..."
          try { Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Type DWord -ErrorAction SilentlyContinue } catch {}
          try { netsh advfirewall firewall delete rule name="RDP-Tailscale" || $null } catch {}
          try { if (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue) { Remove-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue } } catch {}
          try { $exe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"; & $exe down } catch {}
          Write-Host "Cleanup complete."
